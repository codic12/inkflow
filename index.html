async function switchTab(id) {
  if (id === activeTab && currentView === 'canvas') return;

  // Save current
  const cur = tabs.find(t => t.id === activeTab);
  if (cur) {
    cur.strokes = [...strokes];
    cur.redoStack = [...redoStack];
    saveStrokes(); // save immediately in background
  }

  activeTab = id;
  if (!openTabs.includes(id)) openTabs.push(id);
  sidebarSelection = id;
  currentView = 'canvas';

  await fetchAndLoadTab(id);

  renderUI();
}
function renderUI() {
  const home = document.getElementById('home-screen');
  const tabBar = document.getElementById('tab-bar');
  const toolbar = document.getElementById('toolbar');
  const canvasWrap = document.getElementById('canvas-wrap');

  if (currentView === 'home') {
    home.classList.add('active');
    tabBar.style.display = 'none';
    toolbar.style.display = 'none';
    canvasWrap.style.display = 'none';
    renderHome();
  } else {
    home.classList.remove('active');
    tabBar.style.display = 'flex';
    toolbar.style.display = 'flex';
    canvasWrap.style.display = 'block';
    renderAll();
    renderTabs();
  }
  renderSidebar();
}

async function closeTab(e, id) {
  e.stopPropagation();
  
  const index = openTabs.indexOf(id);
  if (index > -1) {
    openTabs.splice(index, 1);
  }

  if (openTabs.length === 0) {
    // If no tabs left, try to open scratchpad or a default note
    const defaultId = 'scratchpad';
    if (!tabs.find(t => t.id === defaultId)) {
      tabs.push({ id: defaultId, title: 'Scratchpad', strokes: [], redoStack: [], notebookId: null });
    }
    openTabs = [defaultId];
    await switchTab(defaultId);
    return;
  }

  if (activeTab === id) {
    const nextId = openTabs[Math.max(0, index - 1)];
    await switchTab(nextId);
  } else {
    renderTabs();
    renderSidebar();
  }
}
function renderTabs() {
  const el = document.getElementById('tabs');
  const filteredTabs = openTabs.map(id => tabs.find(t => t.id === id)).filter(Boolean);

  el.innerHTML = filteredTabs.map(t => `
    <div class="tab ${t.id === activeTab ? 'active' : ''}" onclick="switchTab('${t.id}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.8"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      ${t.id === 'scratchpad' ? `<span>${t.title}</span>` : `
      <span contenteditable="false" spellcheck="false" title="Double click to rename"
            ondblclick="this.contentEditable=true; this.focus();" 
            onblur="this.contentEditable=false; renameNote('${t.id}', this.innerText)" 
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${t.title}</span>
      `}
      ${t.isCover ? '' : `<span class="tab-close" onclick="closeTab(event, '${t.id}')">×</span>`}
    </div>
  `).join('');
}

async function toggleSettings() {
  const choice = await showModal({
    title: 'Settings',
    body: 'Select an action for your data:',
    confirmText: 'Export Library'
  });
  
  if (choice === true) {
    const data = await db.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `inkflow-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    showTip('Library exported');
  } else if (choice === null) {
    // Check if they want to import
    const importOk = await showModal({
      title: 'Import Library',
      body: 'Do you want to import a library backup? This will overwrite current metadata and add missing notes.',
      confirmText: 'Import'
    });
    
    if (importOk) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (re) => {
          try {
            const data = JSON.parse(re.target.result);
            await db.importAll(data);
            showTip('Import successful! Reloading...');
            setTimeout(() => location.reload(), 1000);
          } catch (err) {
            console.error(err);
            showTip('Import failed');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }
  }
}

async function selectNav(el) {
  const navType = el.dataset.nav;
  sidebarSelection = navType;
  currentNotebookId = navType;
  
  if (navType === 'home') {
    currentView = 'home';
    renderUI();
    return;
  }

  if (navType === 'scratchpad') {
    let pad = tabs.find(t => t.id === 'scratchpad');
    if (!pad) {
      pad = { id: 'scratchpad', title: 'Scratchpad', strokes: [], redoStack: [], notebookId: null };
      tabs.push(pad);
    }
    await switchTab(pad.id);
    return;
  }

  if (navType.startsWith('nb-')) {
    // Open or create cover page for the notebook
    let cover = tabs.find(t => t.id === 'cover-' + navType);
    if (!cover) {
      const nb = notebooks.find(n => n.id === navType);
      cover = { id: 'cover-' + navType, title: nb.name, strokes: [], redoStack: [], notebookId: navType, isCover: true };
      tabs.push(cover);
    }
    await switchTab(cover.id);
    return;
  }

  currentView = 'canvas';
  renderUI();
}

  const nb = notebooks.find(n => n.id === id);
  const newName = await showModal({
    title: 'Rename Notebook',
    body: 'Enter a new name for the notebook:',
    showInput: true,
    defaultValue: nb.name
  });
  if (newName) {
    nb.name = newName;
    // Also update cover page title if it exists
    const cover = tabs.find(t => t.id === 'cover-' + id);

async function deleteNote(e, id) {
  e.stopPropagation();
  const note = tabs.find(t => t.id === id);
  const ok = await showModal({
    title: 'Delete Note',
    body: `Delete note "${note.title}"? This cannot be undone.`
  });
  if (!ok) return;

  // Remove from IndexedDB
  await db.deleteNote(id);

  // Remove from open tabs if present
  openTabs = openTabs.filter(tid => tid !== id);
  
  // Remove from library
  tabs = tabs.filter(t => t.id !== id);
  
  if (activeTab === id) {
    if (openTabs.length > 0) {
      await switchTab(openTabs[0]);
    } else {
      currentNotebookId = 'all';
      sidebarSelection = 'all';
      await switchTab('scratchpad');
    }
  } else {
    renderSidebar();
    renderTabs();
  }
  
  debouncedSave();
}

async function deleteNotebook(e, id) {
  e.stopPropagation();
  const nb = notebooks.find(n => n.id === id);
  const ok = await showModal({
    title: 'Delete Notebook',
    body: `Delete notebook "${nb.name}" and all its notes? This cannot be undone.`
  });
  if (!ok) return;

  // Remove notebook
  notebooks = notebooks.filter(n => n.id !== id);
  
  // Remove associated notes
  const notesToRemove = tabs.filter(t => t.notebookId === id);
  for (const note of notesToRemove) {
    await db.deleteNote(note.id);
  }
  tabs = tabs.filter(t => t.notebookId !== id);
  
  // If active tab was in this notebook, switch to All Notes
  if (notesToRemove.find(t => t.id === activeTab) || activeTab === 'cover-' + id) {
    currentNotebookId = 'all';
    sidebarSelection = 'all';
    if (tabs.length > 0) {
      switchTab(tabs[0].id);
    } else {
      newTab();
    }
  } else {
    renderSidebar();
    renderTabs();
  }
  
  debouncedSave();
}

// EXPORT SCRATCHPAD
// ═══════════════════════════════════════════════════════════
async function exportScratchpadToNote() {
  let scratchStrokes = [];
  let scratchRedo = [];
  
  if (activeTab === 'scratchpad') {
    scratchStrokes = JSON.parse(JSON.stringify(strokes));
    scratchRedo = JSON.parse(JSON.stringify(redoStack));
  } else {
    // Try to get from tabs memory
    const pad = tabs.find(t => t.id === 'scratchpad');
    if (pad && pad.strokes !== undefined) {
      scratchStrokes = JSON.parse(JSON.stringify(pad.strokes));
      scratchRedo = JSON.parse(JSON.stringify(pad.redoStack || []));
    } else {
      // Fetch from DB
      const data = await db.getNote('scratchpad');
      if (data) {
        scratchStrokes = data.strokes || [];
        scratchRedo = data.redoStack || [];
      }
    }
  }

  if (!scratchStrokes || scratchStrokes.length === 0) {
    showTip('Scratchpad is empty. Nothing to export!');
    return;
  }

  // Ask for a title
  const noteTitle = await showModal({
    title: 'Export Scratchpad to Note',
    body: 'Enter a title for the new note:',
    showInput: true,
    defaultValue: 'Scratchpad Export ' + new Date().toLocaleDateString()
  });

  if (noteTitle === null) return; // user cancelled

  const id = Date.now().toString();
  const notebookId = currentNotebookId.startsWith('nb-') ? currentNotebookId : (notebooks.length > 0 ? notebooks[0].id : null);
  
  const newNote = {
    id,
    title: noteTitle.trim() || 'Untitled scratchpad note',
    strokes: scratchStrokes,
    redoStack: scratchRedo,
    notebookId: notebookId
  };

  tabs.push(newNote);
  if (!openTabs.includes(id)) openTabs.push(id);
  
  // Save note content immediately
  await db.saveNote(id, {
    strokes: scratchStrokes,
    redoStack: scratchRedo,
    viewState: { offsetX: 0, offsetY: 0, scale: 1 }
  });

  // Save metadata
  await saveMeta();

  // Switch to the newly created note
  await switchTab(id);
  showTip('Scratchpad exported to note!');
}

// ═══════════════════════════════════════════════════════════
// EXPORT NOTE TO IMAGE
// ═══════════════════════════════════════════════════════════
function exportToImage() {
  if (strokes.length === 0) {
    showTip('Canvas is empty. Nothing to export!');
    return;
  }

  const bounds = getDrawnAreaBounds();
  if (!bounds) {
    showTip('Canvas is empty. Nothing to export!');
    return;
  }

  const padding = 20;
  const x1 = bounds.x1 - padding;
  const y1 = bounds.y1 - padding;
  const x2 = bounds.x2 + padding;
  const y2 = bounds.y2 + padding;
  const w = x2 - x1;
  const h = y2 - y1;

  const modal = document.getElementById('export-modal-overlay');
  const infoEl = document.getElementById('export-modal-info');
  const filenameInput = document.getElementById('export-filename');
  const scaleSelect = document.getElementById('export-scale');
  const bgSelect = document.getElementById('export-bg');

  const curTab = tabs.find(t => t.id === activeTab);
  const title = curTab ? curTab.title : 'note';
  filenameInput.value = title.replace(/[^a-z0-9_-]/gi, '_');

  infoEl.textContent = `Drawn Area: ${Math.round(w)} x ${Math.round(h)} px`;

  modal.classList.add('active');

  return new Promise((resolve) => {
    const cancelBtn = document.getElementById('export-modal-cancel');
    const confirmBtn = document.getElementById('export-modal-confirm');

    const close = () => {
      modal.classList.remove('active');
      cancelBtn.onclick = null;
      confirmBtn.onclick = null;
    };

    cancelBtn.onclick = () => {
      close();
      resolve(false);
    };

    confirmBtn.onclick = async () => {
      const exportScale = parseFloat(scaleSelect.value) || 3;
      const exportBg = bgSelect.value;
      const fileName = (filenameInput.value.trim() || 'note') + '.png';

      close();

      showTip('Preparing export...');

      // Make sure all images are loaded
      await ensureAllImagesLoaded();

      // Create temporary canvas
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = w * exportScale;
      exportCanvas.height = h * exportScale;
      const exportCtx = exportCanvas.getContext('2d');

      // Save selection states
      const savedSelectionRect = selectionRect;
      const savedSelectedStrokes = [...selectedStrokes];
      const savedSpaceDown = spaceDown;
      const savedCurrentTool = currentTool;

      // Clear selection for clean render
      selectionRect = null;
      selectedStrokes = [];
      spaceDown = false;
      if (currentTool === 'pan') {
        currentTool = 'pencil';
      }

      // Draw background
      if (exportBg !== 'transparent') {
        const bg = theme === 'light' ? '#faf9f6' : '#1c1d1f';
        exportCtx.fillStyle = bg;
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        if (exportBg === 'theme-grid' && bgGridStyle !== 'blank') {
          const ruledColor = theme === 'light' ? 'rgba(0, 100, 200, 0.05)' : 'rgba(100, 116, 139, 0.15)';
          const marginColor = theme === 'light' ? 'rgba(220, 50, 50, 0.18)' : 'rgba(220, 50, 50, 0.12)';

          exportCtx.save();
          exportCtx.scale(exportScale, exportScale);
          exportCtx.translate(-x1, -y1);

          if (bgGridStyle === 'ruled' || bgGridStyle === 'grid') {
            exportCtx.strokeStyle = ruledColor;
            exportCtx.lineWidth = 0.7;

            // Horizontal lines
            exportCtx.beginPath();
            const startY = Math.ceil(y1 / 28) * 28;
            for (let y = startY; y <= y2; y += 28) {
              exportCtx.moveTo(x1, y);
              exportCtx.lineTo(x2, y);
            }
            exportCtx.stroke();

            if (bgGridStyle === 'grid') {
              // Vertical lines
              exportCtx.beginPath();
              const startX = Math.ceil(x1 / 28) * 28;
              for (let x = startX; x <= x2; x += 28) {
                exportCtx.moveTo(x, y1);
                exportCtx.lineTo(x, y2);
              }
              exportCtx.stroke();
            } else {
              // Ruled margin line (only in ruled mode)
              if (x1 <= 80 && x2 >= 80) {
                exportCtx.strokeStyle = marginColor;
                exportCtx.lineWidth = 1.0;
                exportCtx.beginPath();
                exportCtx.moveTo(80, y1);
                exportCtx.lineTo(80, y2);
                exportCtx.stroke();
              }
            }
          } else if (bgGridStyle === 'dots') {
            exportCtx.fillStyle = theme === 'light' ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.2)';
            const dotSize = 1.0;

            const startX = Math.ceil(x1 / 28) * 28;
            const startY = Math.ceil(y1 / 28) * 28;

            for (let x = startX; x <= x2; x += 28) {
              for (let y = startY; y <= y2; y += 28) {
                exportCtx.beginPath();
                exportCtx.arc(x, y, dotSize, 0, Math.PI * 2);
                exportCtx.fill();
              }
            }
          }
          exportCtx.restore();
        }
      }

      // Draw clean drawing onto export canvas
      exportCtx.save();
      exportCtx.scale(exportScale, exportScale);
      exportCtx.translate(-x1, -y1);

      for (const s of strokes) {
        drawStroke(exportCtx, s);
      }

      exportCtx.restore();

      // Restore selection states
      selectionRect = savedSelectionRect;
      selectedStrokes = savedSelectedStrokes;
      spaceDown = savedSpaceDown;
      currentTool = savedCurrentTool;

      try {
        // Trigger download
        const dataUrl = exportCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataUrl;
        link.click();
        showTip('Exported note to image');
        resolve(true);
      } catch (err) {
        console.error('Failed to export to image:', err);
        showTip('Failed to export to image');
        resolve(false);
      }
    };
  });
}

function getDrawnAreaBounds() {
  if (strokes.length === 0) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of strokes) {
    const b = getStrokeBounds(s);
    minX = Math.min(minX, b.x1);
    minY = Math.min(minY, b.y1);
    maxX = Math.max(maxX, b.x2);
    maxY = Math.max(maxY, b.y2);
  }
  if (minX === Infinity || minY === Infinity || maxX === -Infinity || maxY === -Infinity) {
    return null;
  }
  return { x1: minX, y1: minY, x2: maxX, y2: maxY };
}

function ensureAllImagesLoaded() {
  const images = [];
  for (const s of strokes) {
    if (s.tool === 'image') {
      images.push(preloadImage(s.url));
    }
  }
  const promises = images.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  });
  return Promise.all(promises);
}

// COMMAND PALETTE
// ═══════════════════════════════════════════════════════════
let commandPaletteOpen = false;
let commandPaletteFilteredItems = [];
let commandPaletteSelectedIndex = 0;

const commandPaletteItems = [
  // Background style choices
  { id: 'bg-ruled', label: 'Switch to Ruled Background', category: 'Background', action: () => { bgGridStyle = 'ruled'; localStorage.setItem('bgGridStyle', 'ruled'); drawGrid(); showTip('Background: Ruled'); } },
  { id: 'bg-grid', label: 'Switch to Grid Background', category: 'Background', action: () => { bgGridStyle = 'grid'; localStorage.setItem('bgGridStyle', 'grid'); drawGrid(); showTip('Background: Grid'); } },
  { id: 'bg-dots', label: 'Switch to Dot Grid Background', category: 'Background', action: () => { bgGridStyle = 'dots'; localStorage.setItem('bgGridStyle', 'dots'); drawGrid(); showTip('Background: Dots'); } },
  { id: 'bg-blank', label: 'Switch to Blank Background', category: 'Background', action: () => { bgGridStyle = 'blank'; localStorage.setItem('bgGridStyle', 'blank'); drawGrid(); showTip('Background: Blank'); } },
  
  // Scratchpad export
  { id: 'export-scratchpad', label: 'Export Scratchpad to a Note', category: 'Actions', action: () => { exportScratchpadToNote(); } },
  { id: 'export-image', label: 'Export Note to Image (PNG)', category: 'Actions', action: () => { exportToImage(); } },

  // Settings & Theme
  { id: 'toggle-settings', label: 'Open Settings (Import/Export Library)', category: 'Settings', action: () => { toggleSettings(); } },
  { id: 'toggle-theme', label: 'Toggle Dark/Light Theme', category: 'Settings', action: () => { toggleTheme(); } },
  { id: 'clear-canvas', label: 'Clear Canvas', category: 'Actions', action: () => { clearCanvas(); } },
  { id: 'manage-tags', label: 'Manage Tags for Note', category: 'Actions', action: () => { manageNoteTags(); } },
  { id: 'insert-image', label: 'Insert Image', category: 'Actions', action: () => { insertImage(); } },
  
  // Tools
  { id: 'tool-pen', label: 'Tool: Pen', category: 'Tools', action: () => { setTool('pen'); } },
  { id: 'tool-pencil', label: 'Tool: Pencil', category: 'Tools', action: () => { setTool('pencil'); } },
  { id: 'tool-marker', label: 'Tool: Marker / Highlighter', category: 'Tools', action: () => { setTool('marker'); } },
  { id: 'tool-eraser', label: 'Tool: Eraser', category: 'Tools', action: () => { setTool('eraser'); } },
  { id: 'tool-select', label: 'Tool: Selection Tool', category: 'Tools', action: () => { setTool('select'); } },
  { id: 'tool-circle', label: 'Tool: Draw Circle', category: 'Tools', action: () => { setTool('circle'); } },
  { id: 'tool-oval', label: 'Tool: Draw Oval', category: 'Tools', action: () => { setTool('oval'); } },
  { id: 'tool-rect', label: 'Tool: Draw Rectangle', category: 'Tools', action: () => { setTool('rect'); } },
  { id: 'tool-line', label: 'Tool: Draw Line', category: 'Tools', action: () => { setTool('line'); } },
  { id: 'tool-text', label: 'Tool: Draw Text', category: 'Tools', action: () => { setTool('text'); } },
  { id: 'tool-pan', label: 'Tool: Pan Canvas', category: 'Tools', action: () => { setTool('pan'); } },
];

function getDynamicCommandItems() {
  const dynamicItems = [...commandPaletteItems];
  
  // Add tabs as options
  openTabs.forEach(tabId => {
    const tabObj = tabs.find(t => t.id === tabId);
    if (tabObj) {
      dynamicItems.push({
        id: `switch-tab-${tabId}`,
        label: `Switch to Tab: ${tabObj.title}`,
        category: 'Tabs',
        action: () => { switchTab(tabId); }
      });
    }
  });

  return dynamicItems;
}

function toggleCommandPalette() {
  const backdrop = document.getElementById('command-palette-backdrop');
  const input = document.getElementById('command-palette-input');
  
  if (commandPaletteOpen) {
    backdrop.classList.remove('visible');
    commandPaletteOpen = false;
    input.blur();
  } else {
    backdrop.classList.add('visible');
    commandPaletteOpen = true;
    input.value = '';
    commandPaletteSelectedIndex = 0;
    renderCommandPaletteResults('');
    setTimeout(() => {
      input.focus();
    }, 50);
  }
}

function closeCommandPalette(e) {
  if (commandPaletteOpen) {
    toggleCommandPalette();
  }
}

function renderCommandPaletteResults(query) {
  const container = document.getElementById('command-palette-results');
  const items = getDynamicCommandItems();
  
  // Filter items
  const normalizedQuery = query.toLowerCase().trim();
  let filtered = items;
  if (normalizedQuery) {
    filtered = items.filter(item => 
      item.label.toLowerCase().includes(normalizedQuery) ||
      item.category.toLowerCase().includes(normalizedQuery)
    );
  }
  
  // Group by category
  const categories = {};
  filtered.forEach(item => {
    if (!categories[item.category]) {
      categories[item.category] = [];
    }
    categories[item.category].push(item);
  });
  
  // Flatten for keyboard navigation indexing
  commandPaletteFilteredItems = [];
  let html = '';
  
  const orderedCategories = ['Tabs', 'Tools', 'Background', 'Actions', 'Settings'];
  
  orderedCategories.forEach(cat => {
    if (categories[cat] && categories[cat].length > 0) {
      html += `<div class="command-palette-group-header">${cat}</div>`;
      categories[cat].forEach(item => {
        const globalIndex = commandPaletteFilteredItems.length;
        commandPaletteFilteredItems.push(item);
        
        const isSelected = globalIndex === commandPaletteSelectedIndex;
        
        // Find shortcuts if applicable
        let shortcut = '';
        if (item.id === 'tool-pen') shortcut = 'P';
        else if (item.id === 'tool-pencil') shortcut = 'B';
        else if (item.id === 'tool-marker') shortcut = 'M';
        else if (item.id === 'tool-eraser') shortcut = 'E';
        else if (item.id === 'tool-select') shortcut = 'S';
        else if (item.id === 'toggle-theme') shortcut = 'Theme Toggle';
        
        html += `
          <div class="command-palette-item ${isSelected ? 'selected' : ''}" 
               data-index="${globalIndex}" 
               onclick="executeCommandAtIndex(${globalIndex})">
            <span>${item.label}</span>
            ${shortcut ? `<span class="command-palette-shortcut">${shortcut}</span>` : ''}
          </div>
        `;
      });
    }
  });
  
  // Also list other categories not in ordered list
  Object.keys(categories).forEach(cat => {
    if (!orderedCategories.includes(cat) && categories[cat].length > 0) {
      html += `<div class="command-palette-group-header">${cat}</div>`;
      categories[cat].forEach(item => {
        const globalIndex = commandPaletteFilteredItems.length;
        commandPaletteFilteredItems.push(item);
        
        const isSelected = globalIndex === commandPaletteSelectedIndex;
        html += `
          <div class="command-palette-item ${isSelected ? 'selected' : ''}" 
               data-index="${globalIndex}" 
               onclick="executeCommandAtIndex(${globalIndex})">
            <span>${item.label}</span>
          </div>
        `;
      });
    }
  });

  if (commandPaletteFilteredItems.length === 0) {
    html = `<div style="padding: 20px; text-align: center; opacity: 0.5; font-size: 13.5px;">No matching commands found</div>`;
  }
  
  container.innerHTML = html;
  
  // Scroll selected item into view if necessary
  const selectedEl = container.querySelector('.command-palette-item.selected');
  if (selectedEl) {
    selectedEl.scrollIntoView({ block: 'nearest' });
  }
}

function executeCommandAtIndex(index) {
  const item = commandPaletteFilteredItems[index];
  if (item && item.action) {
    toggleCommandPalette();
    setTimeout(() => {
      item.action();
    }, 150);
  }
}

// Bind input event to command palette search
document.getElementById('command-palette-input').addEventListener('input', (e) => {
  commandPaletteSelectedIndex = 0;
  renderCommandPaletteResults(e.target.value);
});
